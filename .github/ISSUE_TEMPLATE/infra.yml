name: "🔧 Infrastructure"
description: "Infrastructure improvement."
labels: ["🔧 infra"]
body:
  - type: textarea
    attributes:
      label: "🔧 Overview"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: "📦 Area"
      options: [chat-core, chat-server, chat-client, DevOps/CI, Docs, Other]
    validations:
      required: true
  - type: textarea
    attributes:
      label: "📋 As-Is (Current)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "🎯 To-Be (Goal)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "🔨 Tasks"
      placeholder: "- [ ] Select library\n- [ ] Implement\n- [ ] Test\n- [ ] Migrate"
    validations:
      required: true
